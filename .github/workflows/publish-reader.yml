name: Publish Mirqat reader

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirqat-reader-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned tools and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_PATH=" + require("playwright").chromium.executablePath() + String.fromCharCode(10))'
      - name: Build and check editorial integrity
        run: |
          python3 scripts/build_site.py
          python3 tests/check_integrity.py
          python3 tests/check_ilm_integrity.py
          python3 tests/check_taharah_integrity.py
          node --check src/reader.js
          git diff --check
      - name: Check reading interactions and layouts
        run: |
          node tests/check_browser.cjs
          node tests/check_ilm_browser.cjs
          node tests/check_taharah_browser.cjs
          node tests/check_online_browser.cjs
          node tests/check_header_browser.cjs
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: c9a3e355b3d7a795880b1d36a1dbe123
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit access to the approved account."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name mirqat-reader --branch develop
